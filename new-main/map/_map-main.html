<script>
	(function () {
		var map = document.querySelector('.map-inspectorates');
		if (!map) return;

		var tooltip = map.querySelector('.map-inspectorates__tooltip');
		var groups = map.querySelectorAll('.map-inspectorates__group');

		function showTooltip(name, x, y) {
			tooltip.textContent = name;
			tooltip.style.left = x + 'px';
			tooltip.style.top = y + 'px';
			tooltip.classList.add('visible');
		}

		function hideTooltip() {
			tooltip.classList.remove('visible');
		}

		groups.forEach(function (group) {
			var name = group.dataset.name;

			group.addEventListener('mouseenter', function (e) {
				group.classList.add('active');
				showTooltip(name, e.clientX, e.clientY);
			});

			group.addEventListener('mousemove', function (e) {
				tooltip.style.left = e.clientX + 'px';
				tooltip.style.top = e.clientY + 'px';
			});

			group.addEventListener('mouseleave', function () {
				group.classList.remove('active');
				hideTooltip();
			});

			// tap on touch devices: first tap shows label, second follows the link
			group.addEventListener('click', function (e) {
				if (!window.matchMedia('(hover: none)').matches) return;
				if (group.classList.contains('active')) return;
				e.preventDefault();
				groups.forEach(function (g) {
					g.classList.remove('active');
				});
				group.classList.add('active');
				showTooltip(name, e.clientX, e.clientY);
			});
		});

		document.addEventListener('touchstart', function (e) {
			if (map.contains(e.target)) return;
			groups.forEach(function (g) {
				g.classList.remove('active');
			});
			hideTooltip();
		});
	})();
</script>
